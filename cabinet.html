<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет · AGORA</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="account.css">
  <script src="i18n.js"></script>
  <script src="account-i18n.js"></script>
  <script src="anketa-config.js"></script>
  <script src="ipip-config.js"></script>
</head>
<body>

<div id="nav-placeholder"></div>

<main class="auth-page">
  <div class="auth-wrap wide">
    <div class="auth-card" id="cab">
      <p class="auth-lead" data-i18n="acc.loading">Загрузка…</p>
    </div>
  </div>
</main>

<div id="footer-placeholder"></div>
<script src="shared.js"></script>
<script type="module">
  import { supabase, t, lang, esc, pageTitle, requireMember, authErrorText } from './account.js';

  pageTitle('acc.cab.title');
  const box = document.getElementById('cab');
  let me = null;

  function render() {
    if (!me) return;
    const since = me.created_at
      ? new Date(me.created_at).toLocaleDateString(lang() === 'en' ? 'en-US' : 'ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })
      : '';
    const initial = (me.name || me.email || '?').trim().charAt(0).toUpperCase();
    box.innerHTML =
      '<div class="section-label">' + esc(t('acc.cab.label')) + '</div>' +
      '<div class="cab-head">' +
        '<div class="cab-avatar">' + esc(initial) + '</div>' +
        '<div>' +
          '<h1 style="margin:0 0 6px;">' + esc(t('acc.cab.hello')) + ', ' + esc(me.name || '') + '</h1>' +
          '<span class="cab-badge">' + esc(t('role.' + (me.role || 'member'))) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="cab-meta">' +
        esc(me.email || '') + '<br>' +
        esc(t('acc.cab.since')) + ' ' + esc(since) +
      '</div>' +
      '<div class="cab-next">' +
        '<h2>' + esc(t('an.title')) + '</h2>' +
        '<p>' + esc(t('acc.cab.anketa_progress').replace('{k}', filled).replace('{total}', total)) + '</p>' +
        '<div class="cab-anketa">' +
          '<a class="btn btn-earth" href="/anketa">' + esc(t(completed ? 'acc.cab.anketa_edit' : (filled ? 'acc.cab.anketa_continue' : 'acc.cab.anketa_start'))) + '</a>' +
        '</div>' +
      '</div>' +
      '<div class="cab-next">' +
        '<h2>' + esc(t('ip.cab.title')) + '</h2>' +
        '<p>' + (ipip ? esc(ipipLine(ipip)) : esc(t('ip.cab.none'))) + '</p>' +
        '<div class="cab-anketa">' +
          '<a class="btn ' + (ipip ? 'btn-outline' : 'btn-earth') + '" href="/test">' + esc(t(ipip ? 'ip.cab.view' : 'ip.cab.take')) + '</a>' +
        '</div>' +
      '</div>' +
      '<div style="margin-top:28px;">' +
        '<button type="button" class="btn btn-outline" id="logoutBtn">' + esc(t('acc.cab.logout')) + '</button>' +
      '</div>';
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      location.replace('/');
    });
  }

  let filled = 0, completed = false, ipip = null;
  const total = window.AGORA_ANKETA.blocks.length;
  const IP = window.AGORA_IPIP;

  // "Экстраверсия: высокий · Доброжелательность: средний · …"
  function ipipLine(row) {
    const en = lang() === 'en';
    return IP.factors.map((f) => (en ? f.en : f.ru) + ': ' + t('ip.level.' + IP.level(f.id, IP.displayScore(row, f)))).join(' · ');
  }

  try {
    me = await requireMember();
    if (me) {
      const [ans, prof, ip] = await Promise.all([
        supabase.from('answers').select('block_id').eq('user_id', me.id),
        supabase.from('profiles').select('anketa_progress').eq('id', me.id).single(),
        supabase.from('ipip_results').select('extraversion,agreeableness,conscientiousness,emotional_stability,openness,taken_at')
          .eq('user_id', me.id).order('taken_at', { ascending: false }).limit(1),
      ]);
      ipip = ip.data && ip.data[0] ? ip.data[0] : null;
      filled = (ans.data || []).length;
      completed = !!(prof.data && prof.data.anketa_progress && prof.data.anketa_progress.completed_at);
    }
    render();
  } catch (err) {
    box.innerHTML = '<div class="auth-msg show error">' + esc(authErrorText(err)) + '</div>';
  }
  document.addEventListener('agora:lang', render);
</script>
</body>
</html>
