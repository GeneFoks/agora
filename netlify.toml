# Static site — no build step. Netlify publishes the repo root as-is.
[build]
  publish = "."
  command = ""

# Clean URLs: 301 the old .html paths to extensionless ones.
# (Netlify still serves /about from about.html, /map from map.html, etc.)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
[[redirects]]
  from = "/manifesto.html"
  to = "/manifesto"
  status = 301
# Land page superseded by Agora-01.
[[redirects]]
  from = "/land.html"
  to = "/agora-01"
  status = 301
  force = true
[[redirects]]
  from = "/land"
  to = "/agora-01"
  status = 301
  force = true
[[redirects]]
  from = "/agora-01.html"
  to = "/agora-01"
  status = 301
[[redirects]]
  from = "/journal.html"
  to = "/journal"
  status = 301
[[redirects]]
  from = "/people.html"
  to = "/people"
  status = 301
# Money/offer pages retired — old links land on the join page.
[[redirects]]
  from = "/own"
  to = "/join"
  status = 301
  force = true
[[redirects]]
  from = "/own.html"
  to = "/join"
  status = 301
  force = true
[[redirects]]
  from = "/offer"
  to = "/join"
  status = 301
  force = true
[[redirects]]
  from = "/offer.html"
  to = "/join"
  status = 301
  force = true
[[redirects]]
  from = "/map.html"
  to = "/map"
  status = 301
[[redirects]]
  from = "/join.html"
  to = "/join"
  status = 301
[[redirects]]
  from = "/platform.html"
  to = "/platform"
  status = 301
# Old gamified app (XP/points) retired — sign-in now lives at /login.
[[redirects]]
  from = "/app.html"
  to = "/login"
  status = 301
  force = true
[[redirects]]
  from = "/app"
  to = "/login"
  status = 301
  force = true
# Account pages: clean URLs.
[[redirects]]
  from = "/register.html"
  to = "/register"
  status = 301
[[redirects]]
  from = "/login.html"
  to = "/login"
  status = 301
[[redirects]]
  from = "/reset.html"
  to = "/reset"
  status = 301
[[redirects]]
  from = "/consent.html"
  to = "/consent"
  status = 301
[[redirects]]
  from = "/cabinet.html"
  to = "/cabinet"
  status = 301
[[redirects]]
  from = "/anketa.html"
  to = "/anketa"
  status = 301
