  });
  var t = function (k, v) {
    var s = window.AgoraI18n ? window.AgoraI18n.t(k) : k;

  };
  var lang = function () { return window.AgoraI18n ? window.AgoraI18n.getLang() : 'ru'; };
  var nf = function (n, d) { return Number(n).toLocaleString(lang() === 'en' ? 'en-US' : 'ru-RU', { maximumFractionDigits: d || 0 }); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  // ─── Геометрия: метры межевания ↔ широта/долгота ──────────────────────────
  var LOT = window.AGORA_LOT7, POLY = LOT.local, BLOCK = LOT.block;
  // Аффинное преобразование по 8 парам точек (метод наименьших квадратов).
  function fit(k) {
    var S = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], R = [0, 0, 0];
    POLY.forEach(function (p, i) {
      var v = [1, p[0], p[1]], z = LOT.latlng[i][k];
      for (var a = 0; a < 3; a++) { R[a] += v[a] * z; for (var b = 0; b < 3; b++) S[a][b] += v[a] * v[b]; }
    });
    // решение 3×3 методом Гаусса
    var M = S.map(function (r, i) { return r.concat([R[i]]); });
    for (var c = 0; c < 3; c++) {
      var piv = c; for (var r = c + 1; r < 3; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
      var tmp = M[c]; M[c] = M[piv]; M[piv] = tmp;
      for (var r2 = 0; r2 < 3; r2++) if (r2 !== c) { var f = M[r2][c] / M[c][c]; for (var j = c; j < 4; j++) M[r2][j] -= f * M[c][j]; }
    }
    return [M[0][3] / M[0][0], M[1][3] / M[1][1], M[2][3] / M[2][2]];
  }
  var AL = fit(0), AG = fit(1);
  function toLL(x, y) { return L.latLng(AL[0] + AL[1] * x + AL[2] * y, AG[0] + AG[1] * x + AG[2] * y); }

  function inside(x, y) {
    var c = false;
    for (var i = 0, j = POLY.length - 1; i < POLY.length; j = i++) {
      var xi = POLY[i][0], yi = POLY[i][1], xj = POLY[j][0], yj = POLY[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
    }

  }
  // Сколько м² сотки лежит внутри границы (по центрам клеток 1×1 м).
  var areaCache = {};
  function blockArea(bx, by) {
    var key = bx + ':' + by;
    if (areaCache[key] == null) {
      var n = 0;
      for (var i = 0; i < BLOCK; i++) for (var j = 0; j < BLOCK; j++) if (inside(bx * BLOCK + i + 0.5, by * BLOCK + j + 0.5)) n++;

    }
    return areaCache[key];
  }
  // ─── Зоны генплана ────────────────────────────────────────────────────────
  var PLAN = window.AGORA_LOT7_PLAN || null, FX = PLAN ? PLAN.front_x : 0;
  function zoneAt(x) {
    if (!PLAN) return null;
    var d = FX - x;
    for (var i = 0; i < PLAN.zones.length; i++) { var z = PLAN.zones[i]; if (d >= z.from && d < z.to) return z; }

  // Южная граница (P3 → P4 → P5 → P6): y по x — нужна для дороги вдоль неё.

  function southY(x) {
    if (x >= SOUTH[0][0]) return SOUTH[0][1];

      var a = SOUTH[i], b = SOUTH[i + 1];

  }

    for (var cx0 = 0; cx0 < Math.ceil(LOT.bbox[0]); cx0++) for (var cy0 = 0; cy0 < Math.ceil(LOT.bbox[1]); cy0++) {

  var NBX = Math.ceil(LOT.bbox[0] / BLOCK), NBY = Math.ceil(LOT.bbox[1] / BLOCK);
  var stats = { blocks: 0, cells: 0 };

  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 22, maxNativeZoom: 19, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics'

  var lotLL = POLY.map(function (p) { return toLL(p[0], p[1]); });
  var lotBounds = L.latLngBounds(lotLL);
  map.fitBounds(lotBounds, { padding: [24, 24] });

  // ─── Сетка на холсте (рисуем в метрах, переводим в пиксели) ──────────────
  var canvas = document.getElementById('lmCanvas'), ctx = canvas.getContext('2d');
  var sel = null;      // { bx, by, cx?, cy? }
  var scheme = false;
  var frame = null;    // текущая проекция: O + x*ex + y*ey (в пикселях контейнера)

  }

    ctx.beginPath(); ctx.rect(0, 0, w, h);
    POLY.forEach(function (p, i) { var q = P(p[0], p[1]); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.closePath();

    var x0 = Math.max(0, Math.min.apply(null, cs.map(function (c) { return c[0]; }))), x1 = Math.min(LOT.bbox[0], Math.max.apply(null, cs.map(function (c) { return c[0]; })));
    var y0 = Math.max(0, Math.min.apply(null, cs.map(function (c) { return c[1]; }))), y1 = Math.min(LOT.bbox[1], Math.max.apply(null, cs.map(function (c) { return c[1]; })));

    // зоны генплана (полосы поперёк участка) + дорога вдоль южной границы

      PLAN.zones.forEach(function (z) {
        var xa = FX - z.to, xb = FX - z.from;
        var q = [P(xa, -5), P(xb, -5), P(xb, LOT.bbox[1] + 5), P(xa, LOT.bbox[1] + 5)];
        ctx.beginPath(); q.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.closePath();
        ctx.globalAlpha = focusZone && focusZone !== z.n ? 0.12 : (scheme ? 0.75 : 0.42);
        ctx.fillStyle = z.color; ctx.fill();
        ctx.globalAlpha = 1;
        if (z.from > 0) { var a = P(xb, -5), b = P(xb, LOT.bbox[1] + 5); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]); }
      });
      var R = PLAN.road;
      ctx.beginPath();
      for (var d = -10; d <= R.to; d += 2) { var p1 = P(FX - d, southY(FX - d) - 1); d === -10 ? ctx.moveTo(p1[0], p1[1]) : ctx.lineTo(p1[0], p1[1]); }
      for (var d2 = R.to; d2 >= -10; d2 -= 2) { var p2 = P(FX - d2, southY(FX - d2) + R.width); ctx.lineTo(p2[0], p2[1]); }
      ctx.closePath(); ctx.fillStyle = 'rgba(176,160,132,0.95)'; ctx.fill();
      // на общем виде 6 м — это 3–4 пикселя: дорисовываем осевую линию, чтобы дорогу было видно
      if (R.width * ppm < 8) {
        ctx.beginPath();
        for (var d3 = -10; d3 <= R.to; d3 += 4) { var p3 = P(FX - d3, southY(FX - d3) + R.width / 2); d3 === -10 ? ctx.moveTo(p3[0], p3[1]) : ctx.lineTo(p3[0], p3[1]); }
        ctx.strokeStyle = 'rgba(214,198,166,0.95)'; ctx.lineWidth = 3; ctx.stroke();
      }
      var tc = P(FX - R.turnaround_d, southY(FX - R.turnaround_d) + R.turnaround_diameter / 2);
      ctx.beginPath(); ctx.arc(tc[0], tc[1], (R.turnaround_diameter / 2) * pxPerMetre(), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(176,160,132,0.95)'; ctx.fill();
    }

    function lines(step, color, width) {
      ctx.beginPath();
      for (var x = Math.floor(x0 / step) * step; x <= x1 + step; x += step) { var a = P(x, Math.max(0, y0 - step)), b = P(x, Math.min(LOT.bbox[1], y1 + step)); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
      for (var y = Math.floor(y0 / step) * step; y <= y1 + step; y += step) { var c = P(Math.max(0, x0 - step), y), d = P(Math.min(LOT.bbox[0], x1 + step), y); ctx.moveTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); }
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
    }
    if (ppm * 1 >= 5) lines(1, 'rgba(255,255,255,0.28)', 0.6);          // клетки 1×1 м
    if (ppm * BLOCK >= 5) lines(BLOCK, ppm * BLOCK >= 40 ? 'rgba(255,214,150,0.85)' : 'rgba(255,214,150,0.45)', ppm * BLOCK >= 40 ? 1.4 : 0.6);
    lines(100, 'rgba(255,190,110,0.75)', 1.4);                           // каждые 100 м

    // выбранная сотка / клетка
    if (sel) {
      var bx = sel.bx * BLOCK, by = sel.by * BLOCK;
      var q = [P(bx, by), P(bx + BLOCK, by), P(bx + BLOCK, by + BLOCK), P(bx, by + BLOCK)];
      ctx.beginPath(); q.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.closePath();
      ctx.fillStyle = 'rgba(196,137,74,0.28)'; ctx.fill(); ctx.strokeStyle = '#ffb25c'; ctx.lineWidth = 2; ctx.stroke();
      if (sel.cx != null) {
        var cx = bx + sel.cx, cy = by + sel.cy;
        var r = [P(cx, cy), P(cx + 1, cy), P(cx + 1, cy + 1), P(cx, cy + 1)];
        ctx.beginPath(); r.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.closePath();
        ctx.fillStyle = 'rgba(255,178,92,0.75)'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
      }
    }
    ctx.restore();

    // граница участка
    polyPath(); ctx.strokeStyle = '#ff4f8b'; ctx.lineWidth = 2.5; ctx.stroke();

    // номера зон (если полоса достаточно широкая на экране)
    if (PLAN && showZones) {
      PLAN.zones.forEach(function (z) {
        var xm = FX - (Math.max(z.from, 0) + Math.min(z.to, FX)) / 2, sp = span(xm);
        if (!sp || (Math.min(z.to, FX) - Math.max(z.from, 0)) * ppm < 22) return;
        var c = P(xm, (sp[0] + sp[1]) / 2 + 6);
        ctx.beginPath(); ctx.arc(c[0], c[1], 12, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(20,18,14,0.88)'; ctx.fill(); ctx.strokeStyle = z.color; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = '600 12px Jost, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(z.n), c[0], c[1] + 0.5);
      });
    }

    hint(ppm);
  }
  var raf = 0;
  function redraw() { if (!raf) raf = requestAnimationFrame(function () { raf = 0; draw(); }); }
  map.on('move zoom resize viewreset zoomend moveend', redraw);
  window.addEventListener('resize', function () { map.invalidateSize(); redraw(); });

  function hint(ppm) {
    var key = ppm >= 5 ? 'lm.hint.near' : (ppm * BLOCK >= 5 ? (sel ? 'lm.hint.mid' : 'lm.hint.far') : 'lm.hint.far');
    document.getElementById('lmHint').textContent = t(key);
  }

  // ─── Нажатие ──────────────────────────────────────────────────────────────
  map.on('click', function (e) {
    var m = unP(e.containerPoint.x, e.containerPoint.y);
    var x = m[0], y = m[1];
    if (!inside(x, y)) { sel = null; panel(t('lm.outside')); redraw(); return; }
    var bx = Math.floor(x / BLOCK), by = Math.floor(y / BLOCK);
    if (pxPerMetre() >= 5) sel = { bx: bx, by: by, cx: Math.floor(x - bx * BLOCK), cy: Math.floor(y - by * BLOCK) };
    else sel = { bx: bx, by: by };
    panel(); redraw();
  });

  function blockName(s) { return (s.bx + 1) + '·' + (s.by + 1); }
  function cellName(s) { return (s.cx + 1) + '·' + (s.cy + 1); }
  function fmtLL(ll) { return ll.lat.toFixed(6) + ', ' + ll.lng.toFixed(6); }

  function panel(msg) {
    var el = document.getElementById('lmPanel');
    if (!sel) {
      el.innerHTML = '<h2>' + esc(t('lm.p.land')) + '</h2><div class="big">Lot 7 · Arroyo Farms</div>' +
        '<p class="lm-soon">' + esc(msg || t('lm.p.idle')) + '</p>' +
        '<p class="lm-note">' + esc(t('lm.note')) + '</p>';
      return;
    }
    var a = blockArea(sel.bx, sel.by);
    var bx = sel.bx * BLOCK, by = sel.by * BLOCK;
    var rows = '';
    if (sel.cx == null) {
      rows += row(t('lm.p.area'), nf(a) + ' ' + t('lm.m2') + ' · ' + t(a === 100 ? 'lm.p.full' : 'lm.p.edge'));
      rows += row(t('lm.p.where'), t('lm.p.from_w', { m: nf(bx) }) + ', ' + t('lm.p.from_s', { m: nf(by) }));
      rows += row(t('lm.p.coords'), fmtLL(toLL(bx + 5, by + 5)));
      el.innerHTML = '<h2>' + esc(t('lm.p.block')) + '</h2><div class="big">' + esc(blockName(sel)) + '</div>' + rows +
        zoneBox(bx + 5) +
        '<button type="button" class="btn btn-earth" id="lmZoom">' + esc(t('lm.p.zoom')) + '</button>' +
        '<p class="lm-note">' + esc(t('lm.note')) + '</p>';
    } else {
      var cx = bx + sel.cx, cy = by + sel.cy;
      rows += row(t('lm.p.inblock'), blockName(sel));
      rows += row(t('lm.p.where'), t('lm.p.from_w', { m: nf(cx) }) + ', ' + t('lm.p.from_s', { m: nf(cy) }));
      rows += row(t('lm.p.coords'), fmtLL(toLL(cx + 0.5, cy + 0.5)));
      el.innerHTML = '<h2>' + esc(t('lm.p.cell')) + '</h2><div class="big">' + esc(blockName(sel) + ' / ' + cellName(sel)) + '</div>' + rows +
        zoneBox(cx + 0.5) +
        '<p class="lm-soon">' + esc(t('lm.p.soon')) + '</p>' +
        '<button type="button" class="btn btn-outline" id="lmBack">' + esc(t('lm.p.back')) + '</button>';
    }
    var z = document.getElementById('lmZoom');
    if (z) z.onclick = function () { map.fitBounds(L.latLngBounds([toLL(bx, by), toLL(bx + BLOCK, by + BLOCK)]), { padding: [60, 60], maxZoom: 21 }); };
    var b = document.getElementById('lmBack');
    if (b) b.onclick = function () { sel = { bx: sel.bx, by: sel.by }; panel(); redraw(); };
  }
  function row(k, v) { return '<div class="lm-row"><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>'; }

  var en = function () { return lang() === 'en'; };
  function stageText(s) {
    if (s === 'резерв') return t('lm.reserve');
    return PLAN.stages[s] ? PLAN.stages[s][en() ? 'en' : 'ru'] : s;
  }
  function zoneBox(x) {
    var z = zoneAt(x);
    if (!z) return '';
    return '<div class="lm-zone" style="border-left-color:' + z.color + '"><b>' + esc(t('lm.p.zone') + ' ' + z.n + ' · ' + (en() ? z.en : z.ru)) + '</b>' +
      esc(en() ? z.d_en : z.d_ru) + '<br><span style="color:var(--muted)">' + esc(t('lm.p.stage') + ': ' + stageText(z.stage)) + '</span></div>';
  }

  function renderLegend() {
    var el = document.getElementById('lmLegend');
    if (!PLAN) { el.innerHTML = ''; return; }
    el.innerHTML = '<h2>' + esc(t('lm.legend.title')) + '</h2><p>' + esc(t('lm.legend.note')) + '</p><div class="lm-zgrid">' +
      PLAN.zones.map(function (z) {
        var a = Math.max(0, z.from), b = Math.min(z.to, 695);
        return '<button type="button" class="lm-zitem" data-zone="' + z.n + '"' + (focusZone === z.n ? ' style="border-color:var(--earth)"' : '') + '>' +
          '<span class="lm-znum" style="background:' + z.color + '">' + z.n + '</span>' +
          '<div><b>' + esc(en() ? z.en : z.ru) + '</b><span>' + esc(t('lm.legend.range', { a: nf(a), b: nf(b) })) + ' · ' + esc(nf(zoneArea[z.n] || 0)) + ' ' + esc(t('lm.m2')) +
          ' · ' + esc(stageText(z.stage)) + '</span></div></button>';
      }).join('') +
      '<div class="lm-zitem" style="cursor:default"><span class="lm-znum" style="background:#b0a084"></span><div><b>' + esc(t('lm.road')) + '</b><span>' + esc(t('lm.legend.road', { w: PLAN.road.width, to: nf(PLAN.road.to), d: PLAN.road.turnaround_diameter })) + '</span></div></div>' +
      '</div>';
    el.querySelectorAll('[data-zone]').forEach(function (btn) {
      btn.onclick = function () {
        var n = Number(btn.dataset.zone), z = PLAN.zones.filter(function (q) { return q.n === n; })[0];
        focusZone = focusZone === n ? null : n;
        if (!showZones) { showZones = true; document.getElementById('lmZones').classList.add('on'); }
        if (focusZone) {
          var xa = Math.max(0, FX - z.to), xb = Math.min(LOT.bbox[0], FX - z.from);
          map.fitBounds(L.latLngBounds([toLL(xa, 0), toLL(xb, LOT.bbox[1])]), { padding: [30, 30], maxZoom: 19 });
          document.querySelector('.lm-mapbox').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        renderLegend(); redraw();
      };
    });
  }

  function renderStats() {
    document.getElementById('lmStats').innerHTML =
      '<span><b>' + esc(t('lm.stat.area', { a: nf(LOT.acres, 3) })) + '</b></span>' +
      '<span>' + esc(t('lm.stat.ha', { h: nf(stats.cells / 10000, 2) })) + '</span>' +
      '<span>' + esc(t('lm.stat.sotki', { n: nf(stats.blocks) })) + '</span>' +
      '<span>' + esc(t('lm.stat.cells', { n: nf(stats.cells) })) + '</span>';
  }

  // ─── Кнопки ───────────────────────────────────────────────────────────────
  var bSat = document.getElementById('lmSat'), bSch = document.getElementById('lmScheme');
  bSat.onclick = function () { scheme = false; if (!map.hasLayer(sat)) sat.addTo(map); bSat.classList.add('on'); bSch.classList.remove('on'); redraw(); };
  bSch.onclick = function () { scheme = true; map.removeLayer(sat); bSch.classList.add('on'); bSat.classList.remove('on'); redraw(); };
  document.getElementById('lmFit').onclick = function () { focusZone = null; renderLegend(); map.fitBounds(lotBounds, { padding: [24, 24] }); redraw(); };
  var bZones = document.getElementById('lmZones');
  if (!PLAN) bZones.style.display = 'none';
  bZones.onclick = function () { showZones = !showZones; if (!showZones) focusZone = null; bZones.classList.toggle('on', showZones); renderLegend(); redraw(); };

  document.addEventListener('agora:lang', function () { renderStats(); renderLegend(); panel(); redraw(); });
  renderStats(); renderLegend(); panel(); draw();
  window.AgoraLandMap = { map: map, toLL: toLL, inside: inside, stats: stats, zoneArea: zoneArea, zoneAt: zoneAt }; // для отладки
})();
</script>
</body>
</html>
